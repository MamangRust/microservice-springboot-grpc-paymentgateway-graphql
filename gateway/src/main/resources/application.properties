spring.application.name=gateway
server.port=8080

springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api-docs/json

# --- GraphQL (BFF edge) ---
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=${GRAPHQL_GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls
spring.graphql.schema.inspection.enabled=true

# OpenAPI server metadata
payment.openapi.dev-url=${PAYMENT_OPENAPI_DEV_URL:http://localhost:8080}
payment.openapi.prod-url=${PAYMENT_OPENAPI_PROD_URL:https://payment.sanedge.com}

# JWT (validated by the gateway filter via common JwtProvider)
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000

# gRPC clients: one per domain service
grpc.client.role.host=${ROLE_HOST:localhost}
grpc.client.role.port=${ROLE_PORT:9006}
grpc.client.user.host=${USER_HOST:localhost}
grpc.client.user.port=${USER_PORT:9011}
grpc.client.merchant.host=${MERCHANT_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_PORT:9005}
grpc.client.card.host=${CARD_HOST:localhost}
grpc.client.card.port=${CARD_PORT:9004}
grpc.client.saldo.host=${SALDO_HOST:localhost}
grpc.client.saldo.port=${SALDO_PORT:9007}
grpc.client.topup.host=${TOPUP_HOST:localhost}
grpc.client.topup.port=${TOPUP_PORT:9008}
grpc.client.transaction.host=${TRANSACTION_HOST:localhost}
grpc.client.transaction.port=${TRANSACTION_PORT:9009}
grpc.client.transfer.host=${TRANSFER_HOST:localhost}
grpc.client.transfer.port=${TRANSFER_PORT:9010}
grpc.client.withdraw.host=${WITHDRAW_HOST:localhost}
grpc.client.withdraw.port=${WITHDRAW_PORT:9013}
grpc.client.auth.host=${AUTH_HOST:localhost}
grpc.client.auth.port=${AUTH_PORT:9012}

# stats-reader (ClickHouse analytics reader)
grpc.client.stats.host=${GRPC_CLIENT_STATS_HOST:localhost}
grpc.client.stats.port=${GRPC_CLIENT_STATS_PORT:9014}
