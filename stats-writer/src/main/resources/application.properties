spring.application.name=stats-writer

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
app.kafka.stats.group-id=${KAFKA_STATS_GROUP_ID:stats-writer-group}

# ---- ClickHouse (write side) ----
clickhouse.url=${CLICKHOUSE_URL:jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}

# ---- One-shot backfill (k8s Job runs this image with APP_BACKFILL_ENABLED=true) ----
app.backfill.enabled=${APP_BACKFILL_ENABLED:false}
backfill.source.url=jdbc:postgresql://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:5432}/${TRANSACTION_DB_NAME:pg_financial}
backfill.source.user=${TRANSACTION_DB_USER:postgres}
backfill.source.password=${TRANSACTION_DB_PASSWORD:postgres}
# Aggregate query run against the source DB. Adjust to the real transaction schema.
backfill.sql=SELECT to_char(created_at, 'YYYY-MM') AS period, \
  COALESCE(card_id, 0) AS card_id, COALESCE(merchant_id, 0) AS merchant_id, \
  SUM(amount) AS volume FROM transactions GROUP BY 1, 2, 3

# ---- Observability ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.otlp.tracing.endpoint=http://localhost:4317
management.tracing.sampling.probability=1.0
