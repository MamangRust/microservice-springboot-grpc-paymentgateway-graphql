spring.application.name=role-service
spring.datasource.url=jdbc:postgresql://${ROLE_DB_HOST:localhost}:${ROLE_DB_PORT:5433}/${ROLE_DB_NAME:example_jpa_payment_gateway}
spring.datasource.username=${ROLE_DB_USER:postgres}
spring.datasource.password=${ROLE_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9006

