spring.datasource.generate-unique-name=true
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH,DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# bind an ephemeral gRPC port during tests
grpc.server.port=0

# gRPC client stubs (not called in unit tests)
grpc.client.user.host=localhost
grpc.client.user.port=9011
grpc.client.role.host=localhost
grpc.client.role.port=9006

# disable seeders: they call downstream gRPC services that are not running in unit tests
app.seed.enabled=false

# JWT (required by common JwtProvider)
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
