spring.application.name=card-service
spring.datasource.url=jdbc:postgresql://${CARD_DB_HOST:localhost}:${CARD_DB_PORT:5433}/${CARD_DB_NAME:example_jpa_payment_gateway}
spring.datasource.username=${CARD_DB_USER:postgres}
spring.datasource.password=${CARD_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9004

# outbound gRPC clients
grpc.client.user.host=${USER_GRPC_HOST:localhost}
grpc.client.user.port=${USER_GRPC_PORT:9011}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
