spring.application.name=user-service
spring.datasource.url=jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5433}/${USER_DB_NAME:example_jpa_payment_gateway}
spring.datasource.username=${USER_DB_USER:postgres}
spring.datasource.password=${USER_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9011

# gRPC client: role service
grpc.client.role.host=${ROLE_GRPC_HOST:localhost}
grpc.client.role.port=${ROLE_GRPC_PORT:9006}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
