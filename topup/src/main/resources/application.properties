spring.application.name=topup-service
spring.datasource.url=jdbc:postgresql://${TOPUP_DB_HOST:localhost}:${TOPUP_DB_PORT:5433}/${TOPUP_DB_NAME:example_jpa_payment_gateway}
spring.datasource.username=${TOPUP_DB_USER:postgres}
spring.datasource.password=${TOPUP_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9008

# gRPC clients (downstream services)
grpc.client.card.host=${CARD_GRPC_HOST:localhost}
grpc.client.card.port=${CARD_GRPC_PORT:9004}
grpc.client.saldo.host=${SALDO_GRPC_HOST:localhost}
grpc.client.saldo.port=${SALDO_GRPC_PORT:9007}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000

# ---- Kafka (transactional outbox relay) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}
kafka.max.block.ms=${KAFKA_MAX_BLOCK_MS:60000}
notification.topup.email=${NOTIFICATION_topup_EMAIL:admin@example.com}

# ---- Outbox publisher (drains the shared outbox table) ----
outbox.publisher.interval-ms=${OUTBOX_PUBLISHER_INTERVAL_MS:5000}
outbox.publisher.initial-delay-ms=${OUTBOX_PUBLISHER_INITIAL_DELAY_MS:5000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:50}
outbox.publisher.max-attempts=${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}
