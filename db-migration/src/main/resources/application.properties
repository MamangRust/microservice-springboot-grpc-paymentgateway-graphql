spring.application.name=db-migration

# Run-to-completion Job: no web server, no gRPC port.
spring.main.web-application-type=none

# ---- Database (replaces quarkus.datasource.*) ----
# Env var names match the app-config ConfigMap (DB_HOST/DB_PORT/DB_NAME) and the
# app-secrets Secret (DB_USER/DB_PASS), so the Kubernetes migrate Job works
# unchanged.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}
spring.datasource.username=${DB_USER:DRAGON}
spring.datasource.password=${DB_PASS:DRAGON}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Flyway (replaces quarkus.flyway.migrate-at-start=true) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Never let Flyway mutate an existing schema it did not create; fail loudly
# instead so a misconfigured migrate Job cannot silently wipe data.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
